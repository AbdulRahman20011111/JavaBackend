
<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Register | Local Marketplace</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e3f2fd, #f8f9fa);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            background: #ffffff;
            width: 400px;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            text-align: center;
        }

        .register-card:hover {
            transform: scale(1.02);
        }

        .register-card h2 {
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px 15px;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            border-radius: 10px;
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            transition: 0.3s ease;
            font-weight: 500;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            transform: scale(1.05);
        }

        .extra-links {
            margin-top: 20px;
        }

        .extra-links a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .input-group-text {
            background-color: #e9f2ff;
            border: none;
            border-radius: 10px 0 0 10px;
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h2><i class="bi bi-person-plus"></i> Register</h2>

    <form action="register" method="post">
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="unm" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-phone"></i></span>
            <input type="text" name="phn" class="form-control" placeholder="Enter phone number" required>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-calendar"></i></span>
            <input type="date" name="dob" class="form-control" placeholder="Enter date of birth" required>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" name="mail" class="form-control" placeholder="Email address" required>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="pass" class="form-control" placeholder="Create password" required>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
            <input type="text" name="add" class="form-control" placeholder="Enter address" required>
        </div>

        <button type="submit" class="btn btn-primary">Signup / Register</button>
    </form>

    <div class="extra-links">
        <p>Already have an account? <a href="login.html"><i class="bi bi-box-arrow-in-right"></i> Login</a></p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
