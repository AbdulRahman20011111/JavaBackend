
<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Admin Login | Local Marketplace</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa, #e3f2fd);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-card {
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
            text-align: center;
            width: 380px;
            transition: transform 0.3s ease;
        }

        .admin-card:hover {
            transform: scale(1.02);
        }

        .admin-card h2 {
            color: #dc3545;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-danger {
            background-color: #dc3545;
            border: none;
            border-radius: 10px;
            width: 100%;
            padding: 10px;
            transition: 0.3s ease;
            font-weight: 500;
        }

        .btn-danger:hover {
            background-color: #bb2d3b;
            transform: scale(1.05);
        }

        .extra-links {
            margin-top: 20px;
        }

        .extra-links a {
            text-decoration: none;
            color: #0d6efd;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }

        .input-group-text {
            background-color: #f8d7da;
            border: none;
            border-radius: 10px 0 0 10px;
        }

        .input-group .form-control {
            border-radius: 0 10px 10px 0;
        }
    </style>
</head>
<body>

<div class="admin-card">
    <h2><i class="bi bi-shield-lock"></i> Admin Login</h2>

    <form action="admin" method="post">
        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" name="nm" class="form-control" placeholder="Enter Username" required>
        </div>

        <div class="input-group mb-3">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" name="pwd" class="form-control" placeholder="Enter Password" required>
        </div>

        <button type="submit" class="btn btn-danger">Login</button>
    </form>

    <div class="extra-links">
        <p>Not an admin? <a href="login.html"><i class="bi bi-box-arrow-in-right"></i> User Login</a></p>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
