
<!DOCTYPE html>
<html>
<head>
    <meta charset="ISO-8859-1">
    <title>Login | Local Marketplace</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #e3f2fd, #f8f9fa);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #fff;
            padding: 40px 50px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }

        .login-card h2 {
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 25px;
        }

        .form-control {
            border-radius: 10px;
            padding: 10px;
        }

        .btn-primary {
            background-color: #0d6efd;
            border: none;
            border-radius: 10px;
            width: 100%;
            padding: 10px;
            transition: 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #0b5ed7;
            transform: scale(1.05);
        }

        .extra-links {
            margin-top: 20px;
        }

        .extra-links a {
            text-decoration: none;
            color: #0d6efd;
            margin: 0 10px;
            font-weight: 500;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2><i class="bi bi-person-circle"></i> Login</h2>

    <form action="login" method="post">
        <div class="mb-3">
            <input type="text" name="nm" class="form-control" placeholder="Enter Email" required>
        </div>
        <div class="mb-3">
            <input type="password" name="pwd" class="form-control" placeholder="Enter Password" required>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>

    <div class="extra-links">
        <a href="register.html"><i class="bi bi-person-plus"></i> Register</a> |
        <a href="admin.html"><i class="bi bi-shield-lock"></i> Admin</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
